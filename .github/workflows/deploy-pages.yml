name: Deploy viewer to GitHub Pages

# Publishes the static viewer + the already-committed data artifacts.
#
# Design note: this workflow no longer re-runs the extraction pipeline.
# Everything it ships (viewer/, data/audit/, data/processed/) is already
# committed to the repo, so the deploy is a pure "package and upload"
# step — no network calls to USGS, no risk of a 404 breaking a deploy
# because USGS renamed a file. To refresh data from USGS, use the
# `refresh-data.yml` workflow (manual trigger).
#
# Author workflow:
#   1. edit src/, viewer/, or whatever
#   2. python -m src.pipeline --audit   (regenerate locally, fast — PDFs are cached)
#   3. commit src/ + data/ + viewer/data.* together
#   4. push → this workflow ships the committed artifacts verbatim

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight Pages deploy at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # Cheap (~1s) and catches schema / parser regressions before they ship.
        # The tests don't fetch PDFs — they use the committed JSON + tiny fixtures.
        run: python -m unittest discover tests

      - name: Sanity-check committed data artifacts
        # Fail loud if someone pushed code without regenerating data. Cheap —
        # just reads the on-disk JSON and confirms it's not empty / not stale-shaped.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          paths = [
              Path("viewer/data.json"),
              Path("viewer/data.csv"),
              Path("data/processed/elements.json"),
              Path("data/processed/elements.csv"),
          ]
          for p in paths:
              if not p.exists() or p.stat().st_size == 0:
                  sys.exit(f"missing or empty: {p}")
          data = json.loads(Path("viewer/data.json").read_text())
          n = len(data.get("elements", []))
          if n < 20:
              sys.exit(f"viewer/data.json has only {n} elements — looks stale.")
          print(f"ok — {n} elements, generated_at={data.get('generated_at')}")
          PY

      - name: Assemble _site/
        run: |
          set -euo pipefail
          mkdir -p _site/viewer
          cp viewer/index.html viewer/style.css viewer/viewer.js _site/viewer/
          cp viewer/data.json viewer/data.csv _site/viewer/
          # llms.txt — dataset summary for LLM crawlers (https://llmstxt.org).
          # Mirror to both the site root and the viewer dir so /llms.txt resolves
          # regardless of which subpath the crawler hits.
          cp viewer/llms.txt _site/llms.txt
          cp viewer/llms.txt _site/viewer/llms.txt
          mkdir -p _site/data
          cp -r data/audit _site/data/audit
          # Optional: ship the raw processed JSON/CSV for direct download too.
          mkdir -p _site/data/processed
          cp data/processed/elements.json data/processed/elements.csv _site/data/processed/
          # Top-level redirect so the bare site URL opens the viewer.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=viewer/">
            <title>USGS Mineral Commodity Summaries — viewer</title>
            <link rel="canonical" href="viewer/">
          </head>
          <body>
            <p>Redirecting to <a href="viewer/">the viewer</a>.</p>
          </body>
          </html>
          HTML
          echo "Site layout:" && find _site -maxdepth 3 -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on the repo if not yet configured. Avoids
          # requiring a one-time manual step in Settings → Pages.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
