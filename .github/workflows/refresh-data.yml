name: Refresh data from USGS

# Re-fetches every registered MCS PDF, re-runs the extraction pipeline,
# and commits any updated artifacts back to main. Triggered manually
# (the Actions tab → "Refresh data from USGS" → "Run workflow").
#
# Why manual-only:
#   - MCS is published once a year (Feb), so weekly/monthly cron would
#     burn Actions minutes for ~zero changes 51 weeks a year.
#   - When you DO want a refresh (USGS reissued a sheet, or you added a
#     new commodity to src/config.py without local PDFs), run it.
#   - The resulting commit triggers `deploy-pages.yml`, so the live site
#     updates automatically once the refresh finishes.
#
# Inputs let you scope the refresh to a single slug or skip the audit
# screenshots (saves ~15s × n_elements for fast-and-dirty refreshes).

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Single element slug to refresh (blank = all)"
        required: false
        default: ""
      audit:
        description: "Re-render audit screenshots"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      force_refetch:
        description: "Ignore cached PDFs (force re-download from USGS)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write   # needed to commit back

# Don't queue concurrent refreshes — they'd race on the same files.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default token is fine; we'll push back to main below.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extraction pipeline
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.audit }}" = "true" ]; then
            ARGS="$ARGS --audit"
          fi
          if [ "${{ github.event.inputs.force_refetch }}" = "true" ]; then
            ARGS="$ARGS --refresh"
          fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS ${{ github.event.inputs.slug }}"
          fi
          echo "Running: python -m src.pipeline $ARGS"
          python -m src.pipeline $ARGS

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ viewer/data.csv viewer/data.json
          if git diff --cached --quiet; then
            echo "No changes — bundle is up to date with USGS."
            exit 0
          fi
          # Summarise what changed so the commit message tells you the story.
          summary=$(git diff --cached --stat | tail -1)
          git commit -m "data: scheduled refresh from USGS

          ${summary}

          Triggered by: workflow_dispatch
          Inputs: slug='${{ github.event.inputs.slug }}', audit='${{ github.event.inputs.audit }}', force_refetch='${{ github.event.inputs.force_refetch }}'"
          git push origin main
